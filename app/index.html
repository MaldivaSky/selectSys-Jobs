<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>SelectSys Jobs — SaaS Dekassegui | Brasil → Japão</title>
    <meta
      name="description"
      content="SelectSys Jobs torna visível cada etapa da travessia: do primeiro cadastro no Brasil à admissão na fábrica no Japão."
    />

    <!-- Marca oficial. Gerada por scripts/gerar-icones.py a partir da geometria
         da logo — nunca por captura de tela. O SVG vem primeiro (nítido em
         qualquer densidade); o .ico é a queda para navegador e leitor antigo,
         inclusive o que o Vercel usa para o ícone do projeto. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14181f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="SelectSys Jobs" />
    <meta name="apple-mobile-web-app-title" content="SelectSys Jobs" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SelectSys Jobs" />
    <meta property="og:title" content="SelectSys Jobs — SaaS Dekassegui" />
    <meta property="og:image" content="https://selectsys-jobs.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://selectsys-jobs.vercel.app/og-image.png" />
    <meta
      property="og:description"
      content="Cada etapa da travessia, visível. Plataforma de gestão dekassegui Brasil → Japão."
    />

    <!-- A fonte da marca começa a baixar antes do JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* Pinta o fundo da marca antes do React montar: zero flash branco. */
      html { background: #0d1016; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
