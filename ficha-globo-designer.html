<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0d1016;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",system-ui,sans-serif}
@keyframes lgFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>


<div style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px">
  <canvas ref="{{ canvasRef }}" width="240" height="240" style="display:block;width:240px;height:240px"></canvas>
  <sc-if value="{{ showWord }}" hint-placeholder-val="{{ true }}">
  <div style="text-align:center;animation:lgFade .7s .2s both">
    <div style="font:700 26px/1 'Space Grotesk',sans-serif;letter-spacing:-.02em;color: {{ inkColor }}">SelectSys <span style="color:#c4452b">Jobs</span></div>
    <div style="margin-top:9px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.34em;text-transform:uppercase;color: {{ subColor }}">Brasil → Japão</div>
  </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showWordmark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;pageBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0d1016&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;}}">
const D2R = Math.PI / 180;
const SP = [-23.55, -46.63];
const NG = [35.18, 136.9];
const DUR = 3400, T0 = 420, T1 = 2700;

class Component extends DCLogic {
  _vec(lat, lon){const la=lat*D2R,lo=lon*D2R,c=Math.cos(la);return [c*Math.cos(lo),c*Math.sin(lo),Math.sin(la)];}
  _slerp(a,b,f){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];d=Math.max(-1,Math.min(1,d));const o=Math.acos(d);if(o<1e-6)return a.slice();const s=Math.sin(o),w0=Math.sin((1-f)*o)/s,w1=Math.sin(f*o)/s;const r=[w0*a[0]+w1*b[0],w0*a[1]+w1*b[1],w0*a[2]+w1*b[2]];const m=Math.hypot(r[0],r[1],r[2]);return [r[0]/m,r[1]/m,r[2]/m];}
  _ll(v){return [Math.asin(Math.max(-1,Math.min(1,v[2])))/D2R, Math.atan2(v[1],v[0])/D2R];}
  _proj(lat,lon,lat0,lon0,cx,cy,r){const la=lat*D2R,lo=lon*D2R,la0=lat0*D2R,lo0=lon0*D2R,cla=Math.cos(la);const vx=cla*Math.cos(lo),vy=cla*Math.sin(lo),vz=Math.sin(la);const x1=vx*Math.cos(lo0)+vy*Math.sin(lo0),y1=-vx*Math.sin(lo0)+vy*Math.cos(lo0),z1=vz;const front=x1*Math.cos(la0)+z1*Math.sin(la0),up=-x1*Math.sin(la0)+z1*Math.cos(la0);return {x:cx+y1*r,y:cy-up*r,front};}
  _mix(a,b,f){const h=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];const A=h(a),B=h(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')})`;}

  canvasRef = (el) => { cancelAnimationFrame(this._raf); this.canvas = el || null; if (el){ this.t0 = performance.now(); this._loop(); } };
  componentWillUnmount(){ cancelAnimationFrame(this._raf); }

  _loop = () => {
    if (!this.canvas) return;
    let t = performance.now() - this.t0;
    if (t > DUR + 900) { this.t0 = performance.now(); t = 0; }
    this._draw(t);
    this._raf = requestAnimationFrame(this._loop);
  };

  _poly(ctx,pts,lat0,lon0,cx,cy,r){let pen=false;for(const [la,lo] of pts){const p=this._proj(la,lo,lat0,lon0,cx,cy,r);if(p.front>0){if(!pen){ctx.moveTo(p.x,p.y);pen=true;}else ctx.lineTo(p.x,p.y);}else pen=false;}}

  _draw(t){
    const el=this.canvas, ctx=el.getContext('2d');
    const dpr=Math.min(2,window.devicePixelRatio||1), S=240;
    if(el.width!==S*dpr){el.width=S*dpr;el.height=S*dpr;}
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,S,S);
    const cx=S/2, cy=S/2, r=S*0.40;
    const raw=Math.max(0,Math.min(1,(t-T0)/(T1-T0)));
    const p=raw<.5?2*raw*raw:1-Math.pow(-2*raw+2,2)/2;
    const fade=Math.max(0,Math.min(1,t/380));
    const vSP=this._vec(SP[0],SP[1]), vNG=this._vec(NG[0],NG[1]);
    const [lat0,lon0]=this._ll(this._slerp(vSP,vNG,p));
    ctx.globalAlpha=fade;

    const dark = this.props.variant !== 'light';
    const g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.2,cx,cy,r);
    if(dark){g.addColorStop(0,'#233047');g.addColorStop(1,'#0e131d');}
    else{g.addColorStop(0,'#e9edf4');g.addColorStop(1,'#c3ccdb');}
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=g;ctx.fill();

    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();
    ctx.strokeStyle= dark?'rgba(150,175,215,.17)':'rgba(60,80,120,.22)';ctx.lineWidth=0.8;
    for(let lon=-180;lon<180;lon+=30){const pts=[];for(let la=-90;la<=90;la+=4)pts.push([la,lon]);ctx.beginPath();this._poly(ctx,pts,lat0,lon0,cx,cy,r);ctx.stroke();}
    for(let lat=-60;lat<=60;lat+=30){const pts=[];for(let lo=-180;lo<=180;lo+=4)pts.push([lat,lo]);ctx.beginPath();this._poly(ctx,pts,lat0,lon0,cx,cy,r);ctx.stroke();}
    ctx.restore();

    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle= dark?'rgba(120,140,180,.5)':'rgba(70,90,130,.55)';ctx.lineWidth=1.2;ctx.stroke();

    const arc=f=>this._ll(this._slerp(vSP,vNG,f));
    let full=[];for(let i=0;i<=200;i++)full.push(arc(i/200));
    ctx.beginPath();ctx.setLineDash([2,4]);this._poly(ctx,full,lat0,lon0,cx,cy,r);ctx.strokeStyle= dark?'rgba(230,235,245,.22)':'rgba(40,60,100,.3)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);

    const N=Math.max(1,Math.round(p*200));let tr=[];for(let i=0;i<=N;i++)tr.push(arc(i/N*p));
    ctx.beginPath();this._poly(ctx,tr,lat0,lon0,cx,cy,r);ctx.strokeStyle='#e8b04a';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.shadowColor='rgba(232,176,74,.6)';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;

    const sp=this._proj(SP[0],SP[1],lat0,lon0,cx,cy,r);
    if(sp.front>0){ctx.beginPath();ctx.arc(sp.x,sp.y,4,0,7);ctx.fillStyle='#1f9d57';ctx.fill();ctx.beginPath();ctx.arc(sp.x,sp.y,4,0,7);ctx.strokeStyle='#eafaef';ctx.lineWidth=1.4;ctx.stroke();}

    const col=p<.5?this._mix('#1f9d57','#e8a02e',p*2):this._mix('#e8a02e','#c4452b',(p-.5)*2);
    const arrive=Math.max(0,Math.min(1,(t-T1)/400));
    if(arrive>0){ctx.beginPath();ctx.arc(cx,cy,9+arrive*9,0,7);ctx.fillStyle=`rgba(196,69,43,${0.28*(1-arrive)+0.12})`;ctx.fill();}
    ctx.shadowColor=col;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(cx,cy,6.5+arrive*1.5,0,7);ctx.fillStyle=col;ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(cx,cy,6.5+arrive*1.5,0,7);ctx.strokeStyle= dark?'#fff':'#14181f';ctx.lineWidth=1.6;ctx.stroke();
    ctx.globalAlpha=1;
  }

  renderVals(){
    const v = this.props.variant ?? 'dark';
    const dark = v !== 'light';
    return {
      canvasRef: this.canvasRef,
      showWord: this.props.showWordmark ?? true,
      pageBg: this.props.pageBg ?? (dark ? '#0d1016' : '#f4f5f2'),
      inkColor: dark ? '#f4f2ec' : '#14181f',
      subColor: dark ? '#6d7890' : '#8a8f8b',
    };
  }
}
</script>
