<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Protótipo navegável do SelectSys Jobs — sistema de gestão de candidaturas para trabalho no Japão.">
<title>SelectSys Jobs — Protótipo · FUJIARTE</title>

<style>
/* ─── reset ──────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,dl,dd,ul,figure{margin:0}
ul{padding:0;list-style:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse}

/* ─── tokens ─────────────────────────────────────────────────────────── */
:root{
  --ink:#131b2a; --ink-2:#33404f; --muted:#61707c;
  --indigo:#294b86; --indigo-2:#4a6fa8; --indigo-w:#e4eaf4;
  --shu:#c4452b; --shu-w:#f7e6e2;
  --ok:#2e7d5b; --ok-w:#e2f0e9;
  --warn:#a5761c; --warn-w:#f6edda;
  --paper:#edf0ec; --surface:#fff; --surface-2:#f7f8f6;
  --rule:#ccd3cd; --rule-2:#e2e7e2;
  --shadow:0 1px 2px rgba(19,27,42,.06),0 8px 24px -12px rgba(19,27,42,.18);
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e8edf2; --ink-2:#b3c0cc; --muted:#8797a4;
    --indigo:#7ba4de; --indigo-2:#5c85bd; --indigo-w:#1b2a42;
    --shu:#e87259; --shu-w:#3a201a;
    --ok:#5fbe92; --ok-w:#16301f;
    --warn:#d3a84f; --warn-w:#31280f;
    --paper:#0d131d; --surface:#161e2b; --surface-2:#1c2532;
    --rule:#2b3644; --rule-2:#222c39;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ink:#e8edf2; --ink-2:#b3c0cc; --muted:#8797a4;
  --indigo:#7ba4de; --indigo-2:#5c85bd; --indigo-w:#1b2a42;
  --shu:#e87259; --shu-w:#3a201a;
  --ok:#5fbe92; --ok-w:#16301f;
  --warn:#d3a84f; --warn-w:#31280f;
  --paper:#0d131d; --surface:#161e2b; --surface-2:#1c2532;
  --rule:#2b3644; --rule-2:#222c39;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.8);
}
:root[data-theme="light"]{
  --ink:#131b2a; --ink-2:#33404f; --muted:#61707c;
  --indigo:#294b86; --indigo-2:#4a6fa8; --indigo-w:#e4eaf4;
  --shu:#c4452b; --shu-w:#f7e6e2;
  --ok:#2e7d5b; --ok-w:#e2f0e9;
  --warn:#a5761c; --warn-w:#f6edda;
  --paper:#edf0ec; --surface:#fff; --surface-2:#f7f8f6;
  --rule:#ccd3cd; --rule-2:#e2e7e2;
  --shadow:0 1px 2px rgba(19,27,42,.06),0 8px 24px -12px rgba(19,27,42,.18);
}

body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;letter-spacing:-.015em;font-weight:600}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ─── header ─────────────────────────────────────────────────────────── */
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:baseline;gap:8px}
.mark b{font-size:16px;font-weight:650;letter-spacing:-.02em}
.mark span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--indigo);text-transform:uppercase}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);white-space:nowrap}
.chip--seal{color:var(--shu);border-color:var(--shu);background:var(--shu-w)}
.hd-sp{flex:1 1 auto}
.hd-cli{text-align:right;line-height:1.3}
.hd-cli b{font-size:13px;font-weight:600}
.hd-cli small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted)}
.theme{padding:5px 10px;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);transition:border-color .12s,color .12s}
.theme:hover{border-color:var(--indigo);color:var(--indigo)}

/* ─── shell ──────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 62px)}
@media (min-width:960px){ .shell{grid-template-columns:250px 1fr} }

.rail{background:var(--surface);border-bottom:1px solid var(--rule);padding:10px 12px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
@media (min-width:960px){
  .rail{flex-direction:column;overflow-x:visible;border-bottom:0;border-right:1px solid var(--rule);
    padding:18px 12px;gap:1px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto}
}
.rail-h{display:none}
@media (min-width:960px){ .rail-h{display:block;padding:0 10px 12px} }
.step{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:3px;
  text-align:left;white-space:nowrap;transition:background .12s;flex:0 0 auto}
@media (min-width:960px){ .step{white-space:normal} }
.step:hover{background:var(--surface-2)}
.step[aria-current="true"]{background:var(--indigo-w)}
.step-n{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:3px;min-width:16px}
.step[aria-current="true"] .step-n{color:var(--indigo)}
.step-t{font-size:13px;line-height:1.35}
.step[aria-current="true"] .step-t{font-weight:600;color:var(--indigo)}
.step-t em{display:none;font-style:normal;font-size:11px;color:var(--muted)}
@media (min-width:960px){ .step-t em{display:block} }
.rail-div{height:1px;background:var(--rule-2);margin:10px 10px}

/* ─── stage ──────────────────────────────────────────────────────────── */
.stage{padding:26px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:22px;min-width:0}
@media (min-width:1280px){
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:34px;padding:34px 34px 60px}
}

/* Itens de flex/grid nascem com min-width:auto e se recusam a encolher abaixo do
   conteúdo. Sem isto, a tabela larga empurra a página inteira em vez de rolar
   dentro do próprio container. */
.stage>*,.dev>*,.win-body>*,.phone-body>*{min-width:0}
.tbl-wrap,.sheet-wrap{max-width:100%}

.dev{width:100%;display:flex;justify-content:center;min-width:0}
.phone{width:100%;max-width:378px;background:var(--surface);border:1px solid var(--rule);
  border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.phone-bar{display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px 7px;font-family:var(--mono);font-size:10px;color:var(--muted);
  background:var(--surface-2);border-bottom:1px solid var(--rule-2)}
.phone-body{max-height:600px;overflow-y:auto}

.win{width:100%;max-width:940px;min-width:0;background:var(--surface);border:1px solid var(--rule);
  border-radius:7px;box-shadow:var(--shadow);overflow:hidden}
.win-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:var(--surface-2);border-bottom:1px solid var(--rule-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.win-url{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--paper);border-radius:3px;padding:3px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-body{max-height:620px;overflow-y:auto}

.note{width:100%;max-width:940px;background:var(--surface);border:1px solid var(--rule);
  border-radius:5px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
@media (min-width:1280px){ .note{max-width:none;position:sticky;top:34px} }
.note h3{font-size:15px}
.note .ja{font-size:12.5px;color:var(--muted);line-height:1.5}
.note p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.note ul{padding-left:17px;font-size:13px;color:var(--ink-2);line-height:1.65;list-style:disc}
.note li{margin-bottom:3px}
.note-tag{align-self:flex-start;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--indigo-w);color:var(--indigo)}

.navbtns{display:flex;gap:8px;margin-top:2px}
.btn{padding:8px 14px;border-radius:3px;font-size:13px;font-weight:550;
  border:1px solid var(--rule);background:var(--surface);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn--pri{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn--pri:hover{background:var(--indigo-2);border-color:var(--indigo-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn--full{width:100%;text-align:center}

/* ─── app UI ─────────────────────────────────────────────────────────── */
.pad{padding:18px 18px 22px}
.pad-lg{padding:20px 22px 26px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}

.prog{display:flex;gap:3px;padding:12px 18px 0}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--rule-2)}
.prog i.on{background:var(--indigo)}
.prog-t{display:flex;justify-content:space-between;padding:7px 18px 0}

.fld label{display:block;margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);color:var(--ink);font-size:14px}
.inp:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px var(--indigo-w)}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 12px;border:1px solid var(--rule);border-radius:3px;font-size:13px;
  background:var(--surface);transition:background .12s,border-color .12s,color .12s}
.opt:hover{border-color:var(--indigo-2)}
.opt[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.opt--shu[aria-pressed="true"]{background:var(--shu);border-color:var(--shu)}

.saved{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10px;color:var(--ok);letter-spacing:.06em}
.saved b{width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block}

.card{border:1px solid var(--rule);border-radius:4px;background:var(--surface);padding:14px}
.card--ok{border-color:var(--ok);background:var(--ok-w)}
.card--warn{border-color:var(--warn);background:var(--warn-w)}
.card--lock{border-style:dashed;background:var(--surface-2);text-align:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill--ok{color:var(--ok);background:var(--ok-w)}
.pill--warn{color:var(--warn);background:var(--warn-w)}
.pill--shu{color:var(--shu);background:var(--shu-w)}
.pill--ind{color:var(--indigo);background:var(--indigo-w)}

.consent{display:flex;gap:10px;padding:12px;border:1px solid var(--rule);border-radius:3px;background:var(--surface-2)}
.consent input{margin-top:3px;accent-color:var(--indigo);width:16px;height:16px;flex:0 0 auto}
.consent p{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.consent--seal{border-left:3px solid var(--shu)}

.seal{width:74px;height:74px;border:2.5px solid var(--shu);border-radius:50%;color:var(--shu);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--mono);transform:rotate(-9deg);flex:0 0 auto;opacity:.92}
.seal b{font-size:15px;line-height:1;font-weight:700}
.seal i{font-size:8px;font-style:normal;letter-spacing:.08em}

.tbl{width:100%;font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:500;
  padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.av{width:28px;height:28px;border-radius:3px;background:var(--indigo-w);color:var(--indigo);
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:10.5px;font-weight:600;flex:0 0 auto}
.tbl-wrap{overflow-x:auto}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--rule-2)}
.srch{flex:1;min-width:160px}
.fchip{padding:5px 10px;border:1px solid var(--rule);border-radius:14px;font-size:12px;
  background:var(--surface);transition:background .12s,border-color .12s,color .12s}
.fchip:hover{border-color:var(--indigo-2)}
.fchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}

.sec{border-top:1px solid var(--rule-2);padding:16px 20px}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media (min-width:640px){ .grid2{grid-template-columns:repeat(3,1fr)} }
.dt dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dt dd{margin:2px 0 0;font-size:13.5px}
.tl{display:flex;flex-direction:column}
.tl li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.tl li:last-child{border-bottom:0}
.tl time{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:78px;padding-top:2px}

.xls{border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.xls-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ok-w);
  border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.sheet{width:100%;font-size:10.5px;font-family:var(--mono)}
.sheet td{border:1px solid var(--rule);padding:4px 6px;height:22px;white-space:nowrap}
.sheet .hdr{background:var(--surface-2);color:var(--muted);text-align:center;font-size:9px;width:26px}
.sheet .ttl{background:var(--indigo-w);color:var(--indigo);font-weight:700;text-align:center;letter-spacing:.04em}
.sheet .fl{background:var(--surface-2);color:var(--muted);font-size:9px}
.sheet .vl{color:var(--ink);font-weight:600}
.sheet-wrap{overflow-x:auto}

.diffbar{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap;
  background:var(--ok-w);border:1px solid var(--ok);border-radius:3px}
.diffbar .pill{background:transparent}
.diffbar .grow{min-width:0}

.foot{padding:16px 22px;border-top:1px solid var(--rule);text-align:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);background:var(--surface)}

.fadein{animation:fi .32s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.nojs{padding:40px 24px;text-align:center;color:var(--ink-2)}
</style>
</head>
<body>

<header class="hd">
  <div class="mark"><b>SelectSys</b><span>Jobs</span></div>
  <span class="chip chip--seal">Protótipo · 試作版</span>
  <span class="chip">Dados fictícios</span>
  <div class="hd-sp"></div>
  <button class="theme" id="theme" type="button">Tema: auto</button>
  <div class="hd-cli">
    <b>FUJIARTE</b>
    <small>Cliente piloto · 2026</small>
  </div>
</header>

<noscript>
  <div class="nojs">
    <p><b>Este protótipo precisa de JavaScript ativado.</b></p>
    <p>Abra o arquivo no Google Chrome, Microsoft Edge ou Firefox.</p>
  </div>
</noscript>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Etapas do protótipo">
    <div class="rail-h">
      <div class="lbl">Percurso da demonstração</div>
      <div class="lbl" style="letter-spacing:.02em;text-transform:none;margin-top:2px">デモの流れ</div>
    </div>
  </nav>

  <main class="stage">
    <div class="dev" id="dev"></div>
    <aside class="note" id="note"></aside>
  </main>
</div>

<div class="foot">
  Protótipo navegável · Nenhum dado real de candidato · Setas ← → navegam
</div>

<script>
(function(){
"use strict";

/* ── tema ──────────────────────────────────────────────────────────── */
var MODOS=["auto","light","dark"], NOMES={auto:"auto",light:"claro",dark:"escuro"};
var tema = 0;
try{ var s=localStorage.getItem("selectsys-tema"); if(s){ tema=MODOS.indexOf(s); if(tema<0) tema=0; } }catch(e){}
var btTema=document.getElementById("theme");
function aplicaTema(){
  var m=MODOS[tema];
  if(m==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",m);
  btTema.textContent="Tema: "+NOMES[m];
  try{ localStorage.setItem("selectsys-tema",m); }catch(e){}
}
btTema.addEventListener("click",function(){ tema=(tema+1)%MODOS.length; aplicaTema(); });
aplicaTema();

/* ── estado ────────────────────────────────────────────────────────── */
var tattoo={}, filter=null, healthShown=false, exported=false;

var REGIOES=["Cabeça","Rosto","Pescoço","Peito","Costas","Ombros",
             "Braços","Mãos","Abdômen","Cintura","Pernas"];

var CANDIDATOS=[
  {n:"Marina Tanaka Oliveira", i:29, uf:"SP", c:"Guarulhos", jp:"Intermediário", st:"aprovado",  ag:"Nikkei Tour", d:"06/08"},
  {n:"Ricardo Sato Ferreira",  i:34, uf:"PR", c:"Londrina",  jp:"Básico",        st:"entrevista",ag:"Nikkei Tour", d:"06/08"},
  {n:"Camila Yoshida Souza",   i:41, uf:"SP", c:"Suzano",    jp:"Avançado",      st:"revisao",   ag:"Direta",      d:"05/08"},
  {n:"Anderson Kimura Lima",   i:57, uf:"MG", c:"Uberlândia",jp:"Nenhum",        st:"reprovado", ag:"Brasil Nihon",d:"05/08"},
  {n:"Patrícia Nakamura Reis", i:26, uf:"SC", c:"Joinville", jp:"Básico",        st:"aprovado",  ag:"Brasil Nihon",d:"04/08"},
  {n:"Fernando Ueda Barbosa",  i:38, uf:"SP", c:"Mogi das Cruzes",jp:"Intermediário",st:"coe",   ag:"Nikkei Tour", d:"03/08"}
];

var STATUS={
  aprovado:  {l:"Aprovado",           k:"ok"},
  entrevista:{l:"Aguard. entrevista", k:"ind"},
  revisao:   {l:"Revisão manual",     k:"warn"},
  reprovado: {l:"Reprovado",          k:"shu"},
  coe:       {l:"COE em andamento",   k:"ind"}
};

/* ── utilidades ────────────────────────────────────────────────────── */
function el(h){ var d=document.createElement("div"); d.innerHTML=h.replace(/^\s+/,""); return d.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function iniciais(n){ var p=n.split(" "); return (p[0].charAt(0)+p[p.length-1].charAt(0)).toUpperCase(); }
function dois(n){ return n<10 ? "0"+n : ""+n; }

function phone(inner){
  return '<div class="phone"><div class="phone-bar"><span>9:41</span>'+
    '<span class="mono">selectsys.com.br</span><span>▮▮▮</span></div>'+
    '<div class="phone-body">'+inner+'</div></div>';
}
function win(url,inner){
  return '<div class="win"><div class="win-bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i>'+
    '<span class="win-url">'+esc(url)+'</span></div><div class="win-body">'+inner+'</div></div>';
}

/* ── render ────────────────────────────────────────────────────────── */
var cur=0;
var rail=document.getElementById("rail");
var dev=document.getElementById("dev");
var note=document.getElementById("note");

/* Botões de opção: um único tratador para todas as telas.
   #f-reg (tatuagem) é múltipla escolha; os demais grupos são escolha única. */
dev.addEventListener("click",function(e){
  var b=e.target;
  while(b && b!==dev){
    var pai=b.parentNode;
    if(b.tagName==="BUTTON" && pai && pai.className &&
       (" "+pai.className+" ").indexOf(" opts")>=0) break;
    b=pai;
  }
  if(!b || b===dev || b.tagName!=="BUTTON") return;

  var grupo=b.parentNode, j;
  if(grupo.id==="f-reg"){
    var reg=b.getAttribute("data-reg");
    tattoo[reg]=!tattoo[reg];
    b.setAttribute("aria-pressed", tattoo[reg]?"true":"false");
  }else{
    for(j=0;j<grupo.children.length;j++) grupo.children[j].setAttribute("aria-pressed","false");
    b.setAttribute("aria-pressed","true");
  }
});

for(var i=0;i<TELAS.length;i++){
  (function(s,idx){
    var b=el('<button class="step" type="button"><span class="step-n">'+
      dois(idx+1)+'</span><span class="step-t">'+esc(s.t)+
      '<em>'+esc(s.ja)+'</em></span></button>');
    b.addEventListener("click",function(){ cur=idx; render(); });
    rail.appendChild(b);
    if(idx===4) rail.appendChild(el('<div class="rail-div"></div>'));
  })(TELAS[i],i);
}

function render(){
  var s=TELAS[cur], i;

  var passos=rail.querySelectorAll(".step");
  for(i=0;i<passos.length;i++) passos[i].setAttribute("aria-current", i===cur?"true":"false");

  dev.innerHTML=s.r();

  var lis="";
  for(i=0;i<s.li.length;i++) lis+='<li>'+esc(s.li[i])+'</li>';
  note.innerHTML=
    '<span class="note-tag">'+esc(s.tag)+'</span>'+
    '<div><h3>'+esc(s.h)+'</h3><div class="ja">'+esc(s.jah)+'</div></div>'+
    '<p>'+esc(s.p)+'</p><ul>'+lis+'</ul>'+
    '<div class="navbtns">'+
      '<button class="btn" type="button" id="nv-p"'+(cur===0?" disabled":"")+'>← Anterior</button>'+
      '<button class="btn btn--pri grow" type="button" id="nv-n"'+(cur===TELAS.length-1?" disabled":"")+'>Próximo →</button>'+
    '</div>';

  document.getElementById("nv-p").addEventListener("click",function(){ if(cur>0){cur--;render();} });
  document.getElementById("nv-n").addEventListener("click",function(){ if(cur<TELAS.length-1){cur++;render();} });

  var gos=dev.querySelectorAll("[data-go]");
  for(i=0;i<gos.length;i++){
    gos[i].addEventListener("click",function(){ if(cur<TELAS.length-1){cur++;render();} });
  }

  if(s.after) s.after();
}

document.addEventListener("keydown",function(e){
  var t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"&&cur<TELAS.length-1){ cur++; render(); }
  if(e.key==="ArrowLeft"&&cur>0){ cur--; render(); }
});

render();
})();
</script>
